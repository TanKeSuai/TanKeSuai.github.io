<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/index.css">
</head>

<body>
    <div class="header">
        <div class="logo">
            <img src="images/logo.png" alt="Logo" class="logo-icon">
            <div class="ROMALIYA">ROMALIYA</div>
        </div>

        <div class="menu">
            <div class="menu-home">Home</div>
            <div class="menu-item">Menu</div>
            <div class="menu-item">Order</div>
            <div class="menu-item">Promotion</div>
            <div class="menu-item">About Us</div>
            <div class="menu-item">Our Restaurant</div>
            <img src="images/order1.png" alt="Icon" class="menu-icon">
        </div>

        <div class="burger">
            <img src="images/burger.png" alt="Burger Menu" width="20">
        </div>
    </div>



    <div class="banner4">
        <div class="footer-logo">
            <img src="images/logo.png" alt="Logo" class="logo-img">
            <span class="ROMALIYA">ROMALIYA</span>
        </div>

        <p class="footer-desc">
            From the first welcome to the last bite, every detail is designed to create a
            memorable dining experience for you and your loved ones.
        </p>

        <div class="social-icons">
            <img src="images/fb.png" alt="Facebook" class="social-img">
            <img src="images/X.png" alt="X" class="social-img">
            <img src="images/ig.png" alt="Instagram" class="social-img">
            <img src="images/youtube.png" alt="YouTube" class="social-img">
        </div>
    </div>

</body>

</html>
